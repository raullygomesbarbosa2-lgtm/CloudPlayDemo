name: Build CloudPlay demo APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android source
        run: unzip -q CloudPlayDemo-source.zip -d source
      - name: Build APK
        working-directory: source/CloudPlayDemo
        run: gradle :app:assembleDebug
      - name: Publish persistent demo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-demo
          name: CloudPlay Demo 0.1.0
          make_latest: true
          body: |
            APK de demonstração da interface Android.
            Não transmite nem executa jogos; servidores e catálogo ainda não estão conectados.
          files: source/CloudPlayDemo/app/build/outputs/apk/debug/app-debug.apk
